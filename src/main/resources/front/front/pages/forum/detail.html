<!-- 论坛详情 -->
<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
		<title>篮球论坛详情</title>
		<link rel="stylesheet" href="../../layui/css/layui.css">
		<!-- 样式 -->
		<link rel="stylesheet" href="../../css/style.css" />
		<!-- 主题（主要颜色设置） -->
		<link rel="stylesheet" href="../../css/theme.css" />
		<!-- 通用的css -->
		<link rel="stylesheet" href="../../css/common.css" />
	</head>
	<style>
		#swiper {
			overflow: hidden;
		}
		#swiper .layui-carousel-ind li {
			width: 16px;
			height: 10px;
			border-width: 0;
			border-style: solid;
			border-color: rgba(0,0,0,.3);
			border-radius: 3px;
			background-color: rgba(135, 135, 135, 1);
			box-shadow: 0 0 6px #b8b8b8;
		}
		#swiper .layui-carousel-ind li.layui-this {
			width: 34px;
			height: 10px;
			border-width: 0;
			border-style: solid;
			border-color: rgba(0,0,0,.3);
			border-radius: 10px;
			background-color: rgba(96, 128, 144, 1);
			box-shadow: 0 0 6px #b8b8b8;
		}
		
		.index-title {
		    text-align: center;
		    box-sizing: border-box;
		    width: 980px;
		    display: flex;
		    justify-content: center;
		    align-items: center;
		    flex-direction: column;
		}
		.forum-container .btn-container {
			display: flex;
			    align-items: center;
			    box-sizing: border-box;
			    width: 100%;
			    flex-wrap: wrap; 
				justify-content: space-between !important;
		}
		.forum-container .btn-container button i {
			margin-right: 4px;
		}
		.forum-container .message-list .message {
			display: block !important;
			max-width: 100% !important;
			margin: 8px 0 0 0 !important;
			white-space: normal !important;
			word-break: break-word !important;
			overflow-wrap: anywhere !important;
			line-height: 1.8;
			box-sizing: border-box;
		}
		.forum-container .message-list .content {
			height: auto !important;
		}
		.forum-container .message-list .message {
			display: block !important;
			height: auto !important;
			min-height: 20px;
			max-width: 100% !important;
			white-space: normal !important; /* 强制换行 */
			word-break: break-all !important;
			overflow-wrap: break-word !important;
			line-height: 1.6;
		}
	</style>
	<body style="padding-bottom: 20px">

		<div id="app">
			<!-- 轮播图 -->
			<!-- <div class="layui-carousel" id="swiper">
				<div carousel-item id="swiper-item">
					<div v-for="(item,index) in swiperList" v-bind:key="index">
						<img class="swiper-item" :src="item.img">
					</div>
				</div>
			</div> -->
			<div class="layui-carousel" id="swiper" :style='{"boxShadow":"0 0 6px #608090","margin":"0 auto","borderColor":"rgba(0,0,0,.3)","borderRadius":"0px","borderWidth":"0","width":"100%","borderStyle":"solid"}'>
			  <div carousel-item id="swiper-item">
				<div v-for="(item,index) in swiperList" :key="index">
					<div style="position: relative; width: 100%; height: 100%; overflow: hidden; background-color: #000;">
						<div :style="{'backgroundImage': 'url(' + item.img + ')', 'backgroundSize': 'cover', 'backgroundPosition': 'center', 'filter': 'blur(15px)', 'position': 'absolute', 'width': '110%', 'height': '110%', 'top': '-5%', 'left': '-5%', 'zIndex': '0', 'opacity': '0.7'}"></div>
						<img style="width: 100%; height: 100%; object-fit: contain; position: relative; zIndex: '1';" :src="item.img" />
					</div>
				</div>
			  </div>
			</div>
			<!-- 轮播图 -->
			
			<!-- 标题 -->
			<!-- <h2 class="index-title">FORUM / INFORMATION</h2>
			<div class="line-container">
				<p class="line"> 篮球论坛 </p>
			</div> -->
			<div class="index-title" :style='{"padding":"10px","boxShadow":"0 0 0px rgba(255,0,0,.8)","margin":"20px auto","borderColor":"rgba(184, 145, 104, 1)","backgroundColor":"rgba(97, 132, 150, 1)","color":"#333","borderRadius":"14px","borderWidth":"5px","fontSize":"20px","borderStyle":"solid","height":"auto"}'>
			  <span>FORUM / INFORMATION</span><span>篮球论坛</span>
			</div>
			<!-- 标题 -->

			<div class="forum-container">
				<h1 class="title">{{detail.title}}</h1>
				<div class="auth-container">
					发布人：{{detail.username}} 时间：{{detail.addtime}}
				</div>
				<div class="content" v-html="detail.content">
				</div>
				
				<div class="btn-container" :style='{"padding":"10px","boxShadow":"0 0 0px rgba(255,0,0,.8)","margin":"10px 0 10px 0","borderColor":"rgba(0,0,0,.3)","backgroundColor":"rgba(255, 255, 255, 0)","borderRadius":"4px","alignItems":"flex-end","borderWidth":"0","borderStyle":"solid","justifyContent":"flex-end","height":"60px"}'>
					<button :style='{"padding":"0 15px","boxShadow":"0 0 8px rgba(0,0,0,0)","margin":"0 0 0 10px","borderColor":"#409EFF","backgroundColor":"#E10600","color":"#fff","borderRadius":"4px","borderWidth":"0","width":"auto","fontSize":"14px","borderStyle":"solid","height":"40px"}' onclick="window.history.back()" type="button" class="layui-btn layui-btn-lg btn-theme">
						<i v-if="true" class="layui-icon">&#xe65c;</i> 返回列表
					</button>
				</div>
				
				<div class="btn-container" :style='{"padding":"10px","boxShadow":"0 0 0px rgba(255,0,0,.8)","margin":"10px 0 10px 0","borderColor":"rgba(0,0,0,.3)","backgroundColor":"rgba(184, 145, 104, 1)","borderRadius":"4px","alignItems":"flex-end","borderWidth":"0","borderStyle":"solid","justifyContent":"flex-end","height":"60px"}'>
					<div class="title" style="color:#666;font-size: 18px;">
						评论列表
					</div>
					<button :style='{"padding":"0 15px","boxShadow":"0 0 8px rgba(0,0,0,0)","margin":"0 0 0 10px","borderColor":"#409EFF","backgroundColor":"rgba(97, 132, 150, 1)","color":"#fff","borderRadius":"4px","borderWidth":"0","width":"auto","fontSize":"14px","borderStyle":"solid","height":"40px"}' id="btn-add-win" class="layui-btn layui-btn-lg btn-theme">
						<i v-if="true" class="layui-icon">&#xe654;</i> 点击评论
					</button>
				</div>
				
				<!-- <div class="btn-container" :style='{"padding":"10px","boxShadow":"0 0 0px rgba(255,0,0,.8)","margin":"10px 0 10px 0","borderColor":"rgba(0,0,0,.3)","backgroundColor":"rgba(184, 145, 104, 1)","borderRadius":"4px","alignItems":"flex-end","borderWidth":"0","borderStyle":"solid","justifyContent":"flex-end","height":"60px"}'>
					<div class="title" style="color:#666;font-size: 18px;">
						评论列表
					</div>
					<div id="btn-add-win" class="btn">
						点击评论
					</div>
				</div> -->

				<!-- <div class="message-list">
					<div class="message-item" v-for="(item,index) in dataList" v-bind:key="index">
						<div class="username-container">
							<img class="avator" src="../../img/avator.png">
							<span class="username">用户：{{item.username}}</span>
						</div>
						<div class="content">
							<span class="message">
								{{item.content}}
							</span>
						</div>
					</div>
				</div> -->
				
				<!-- 评论列表 -->
				<div class="message-list" v-if="dataList&&dataList.length" :style='{"padding":"20px 0","margin":"20px 0 0","borderColor":"#eee","backgroundColor":"#fff","borderRadius":"8px","borderWidth":"1px","borderStyle":"solid"}'>
					<div :style='{"padding":"15px 20px","margin":"0","borderColor":"#f0f0f0","backgroundColor":"#fff","borderWidth":"0 0 1px 0","borderStyle":"solid","display":"flex","flexDirection":"column"}' class="message-item" v-for="(item,index) in dataList" v-bind:key="index" >
						<!-- 用户信息 -->
						<div class="username-container" style="display: flex;align-items: center;margin-bottom: 10px;">
							<img :style='{"margin":"0 12px 0 0","borderRadius":"50%","width":"36px","height":"36px","objectFit":"cover"}' class="avator" src="../../img/avator.png">
							<span :style='{"color":"#666","fontSize":"14px","fontWeight":"bold"}' class="username">{{item.username}}</span>
						</div>
						<!-- 评论文字内容 -->
						<div class="content" style="padding-left: 48px; width: 100%; box-sizing: border-box; height: auto !important;">
							<div :style='{"padding":"12px 16px","backgroundColor":"#f8f8f8","color":"#333","borderRadius":"8px","fontSize":"15px","lineHeight":"1.6","wordBreak":"break-all","whiteSpace":"normal !important","height":"auto !important","minHeight":"24px","width":"100%","boxSizing":"border-box","display":"block !important"}' class="message">
								{{item.content}}
							</div>
						</div>
					</div>
				</div>
				
				<div class="pager" id="pager"></div>
			</div>
		</div>

		<!-- layui -->
		<script src="../../layui/layui.js"></script>
		<!-- vue -->
		<script src="../../js/vue.js"></script>
		<!-- 组件配置信息 -->
		<script src="../../js/config.js"></script>
		<!-- 扩展插件配置信息 -->
		<script src="../../modules/config.js"></script>
		<!-- 工具方法 -->
		<script src="../../js/utils.js"></script>

		<script>
			var vue = new Vue({
				el: '#app',
				data: {
					// 轮播图
					swiperList: [{
						img: '../../img/banner.jpg'
					}],
					detail: {},
					dataList: []
				},
				methods: {
					jump(url) {
						jump(url)
					}
				}
			})

			layui.use(['layer', 'element', 'carousel', 'laypage', 'http', 'jquery'], function() {
				var layer = layui.layer;
				var element = layui.element;
				var carousel = layui.carousel;
				var laypage = layui.laypage;
				var http = layui.http;
				var jquery = layui.jquery;

				var id = http.getParam('id');

				// 获取轮播图 数据
				http.request('config/list', 'get', {
					page: 1,
					limit: 5
				}, function(res) {
					if (res.data.list.length > 0) {
						let swiperList = [];
						res.data.list.forEach(element => {
							if (element.value != null) {
								swiperList.push({ img: http.baseurl + element.value });
							}
						});
						vue.swiperList = swiperList;

						vue.$nextTick(() => {
							carousel.render({
								elem: '#swiper',
								width: '100%',
								height: '350px',
								arrow: 'hover',
								anim: 'default',
								autoplay: 'true',
								interval: '3000',
								indicator: 'outside'
							});
						})
					}
				});

				// 详情信息
				http.request('forum/list/' + id, 'get', {}, function(res) {
					vue.detail = res.data
					vue.dataList = res.data.childs
				});

				// 添加评论
				jquery('#btn-add-win').click(function(e) {
					layer.open({
						type: 2,
						title: '添加评论',
						area: ['600px', '300px'],
						content: './add-comment.html?pid=' + vue.detail.id
					});
				})

			});
		</script>
	</body>
</html>
