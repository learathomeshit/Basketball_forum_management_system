<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<title>注册</title>
	<link rel="stylesheet" type="text/css" href="../../layui/css/layui.css">
	<link rel="stylesheet" type="text/css" href="../../xznstatic/css/public.css"/>
	<link rel="stylesheet" type="text/css" href="../../xznstatic/css/login.css?v=20260513"/>
	<link rel="stylesheet" type="text/css" href="../../css/auth-shell.css?v=20260513"/>
</head>
<body>
	<div class="auth-page" id="app">
		<div class="login-shell">
			<div class="login-card">
				<div class="login-card-brand">
					<img src="../../img/login-nba-wide.png" alt="NBA" />
					<img class="mark" src="../../img/login-nba-mark.png" alt="" />
					<p class="tagline">篮球论坛系统</p>
				</div>
				<div class="login-card-form">
					<form class="layui-form login-form">
						<h2 class="login-welcome">创建账号</h2>
						<p class="login-sub">填写以下信息完成注册</p>

						<div class="login-field">
							<label class="login-field-label" for="reg-yonghuzhanghao">用户账号</label>
							<input id="reg-yonghuzhanghao" type="text" name="yonghuzhanghao" placeholder="请输入用户账号" autocomplete="username" class="layui-input">
						</div>
						<div class="login-field">
							<label class="login-field-label" for="reg-yonghuxingming">用户姓名</label>
							<input id="reg-yonghuxingming" type="text" name="yonghuxingming" placeholder="请输入用户姓名" autocomplete="name" class="layui-input">
						</div>
						<div class="login-field">
							<label class="login-field-label" for="reg-mima">密码</label>
							<input id="reg-mima" type="password" name="mima" required lay-verify="required" placeholder="请输入密码" autocomplete="new-password" class="layui-input">
						</div>
						<div class="login-field">
							<label class="login-field-label" for="reg-mima2">确认密码</label>
							<input id="reg-mima2" type="password" name="mima2" required lay-verify="required" placeholder="请再次输入密码" autocomplete="new-password" class="layui-input">
						</div>
						<div class="login-field">
							<label class="login-field-label" for="reg-nianling">年龄</label>
							<input id="reg-nianling" type="text" name="nianling" placeholder="请输入年龄" autocomplete="off" class="layui-input">
						</div>
						<div class="login-field">
							<label class="login-field-label" for="reg-lianxidianhua">联系电话</label>
							<input id="reg-lianxidianhua" type="text" name="lianxidianhua" placeholder="请输入联系电话" autocomplete="tel" class="layui-input">
						</div>

						<button type="button" class="layui-btn layui-btn-fluid btn-submit login-submit" lay-submit lay-filter="register">注册</button>
						<p class="txt login-register-row">
							<a class="login-register-link" href="../login/login.html">已有账号登录</a>
						</p>
					</form>
				</div>
			</div>
		</div>
	</div>

	<script src="../../layui/layui.js"></script>
	<script src="../../js/vue.js"></script>
	<script src="../../js/config.js"></script>
	<script src="../../modules/config.js"></script>
	<script src="../../js/utils.js"></script>
	<script src="../../js/validate.js"></script>
	<script>
		var vue = new Vue({
			el: '#app',
			data: {},
			methods: {}
		});

		layui.use(['layer', 'element', 'carousel', 'form', 'http', 'jquery'], function() {
			var layer = layui.layer;
			var form = layui.form;
			var http = layui.http;
			var jquery = layui.jquery;

			var tablename = http.getParam('tablename');

			form.on('submit(register)', function(data) {
				data = data.field;
				if (!data.yonghuzhanghao) {
					layer.msg('用户账号不能为空', { time: 2000, icon: 5 });
					return false;
				}
				if (!data.yonghuxingming) {
					layer.msg('用户姓名不能为空', { time: 2000, icon: 5 });
					return false;
				}
				if (!data.mima) {
					layer.msg('密码不能为空', { time: 2000, icon: 5 });
					return false;
				}
				if (!isIntNumer(data.nianling)) {
					layer.msg('年龄应输入整数', { time: 2000, icon: 5 });
					return false;
				}
				if (!isMobile(data.lianxidianhua)) {
					layer.msg('联系电话应输入手机格式', { time: 2000, icon: 5 });
					return false;
				}
				if (data.mima != data.mima2) {
					layer.msg('两次密码输入不一致', { time: 2000, icon: 5 });
					return false;
				}

				var url = tablename + '/register';
				http.requestJson(url, 'post', data, function(res) {
					layer.msg('注册成功', { time: 2000, icon: 6 }, function() {
						window.location.href = '../login/login.html';
					});
				});
				return false;
			});
		});
	</script>
</body>
</html>
