<!-- 篮球资讯 -->
<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
		<title>篮球资讯</title>
		<link rel="stylesheet" href="../../layui/css/layui.css">
		<!-- 样式 -->
		<link rel="stylesheet" href="../../css/style.css?v=20260512b" />
		<!-- 主题（主要颜色设置） -->
		<link rel="stylesheet" href="../../css/theme.css?v=20260512b" />
		<!-- 通用的css -->
		<link rel="stylesheet" href="../../css/common.css?v=20260512b" />
	</head>
	<style>
		#swiper {
			overflow: hidden;
		}
		#swiper .layui-carousel-ind li {
			width: 16px;
			height: 10px;
			border-width: 0;
			border-style: solid;
			border-color: rgba(0,0,0,.3);
			border-radius: 3px;
			background-color: rgba(135, 135, 135, 1);
			box-shadow: 0 0 6px #b8b8b8;
		}
		#swiper .layui-carousel-ind li.layui-this {
			width: 34px;
			height: 10px;
			border-width: 0;
			border-style: solid;
			border-color: rgba(0,0,0,.3);
			border-radius: 10px;
			background-color: rgba(96, 128, 144, 1);
			box-shadow: 0 0 6px #b8b8b8;
		}
		
		.index-title {
		    text-align: center;
		    box-sizing: border-box;
		    width: 980px;
		    display: flex;
		    justify-content: center;
		    align-items: center;
		    flex-direction: column;
		}
		
		.layui-laypage .layui-laypage-count {
		  padding: 0 10px;
		}
		.layui-laypage .layui-laypage-skip {
		  padding-left: 10px;
		}
		
		.news-container .content {
			margin: 30px auto;
		}
		
		.news-container .btn-container {
			display: flex;
			    align-items: center;
			    box-sizing: border-box;
			    width: 100%;
			    flex-wrap: wrap;
				width: 980px !important;
				    margin: 0 auto !important;
				    justify-content: space-between !important;
		}
		.news-container .btn-container button i {
			margin-right: 4px;
		}

		/* 区块标题：更大（与正文同宽），内部垂直居中 */
		.news-page-section-head {
			box-sizing: border-box;
			width: 980px;
			max-width: calc(100% - 32px);
			min-height: 140px;
			padding: 32px 28px !important;
			margin: 20px auto 12px !important;
			display: flex !important;
			flex-direction: column;
			align-items: center;
			justify-content: center;
		}
		.news-page-section-head span {
			display: block;
		}
		.news-page-section-head span:first-of-type {
			font-size: 12px;
			letter-spacing: 0.28em;
			text-transform: uppercase;
			font-family: Georgia, "Times New Roman", serif;
			opacity: 0.75;
			margin-bottom: 12px;
		}
		.news-page-section-head span:last-of-type {
			font-size: 28px;
			font-weight: 700;
			letter-spacing: 0.06em;
		}

		/* 文章标题区：更扁、标题与时间作为整体垂直居中（避免上轻下重） */
		.news-article-title-card {
			box-sizing: border-box;
			width: 980px;
			max-width: calc(100% - 32px);
			margin: 0 auto 14px;
			padding: 10px 24px;
			min-height: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			background: var(--ui-card, #fff);
			border: 1px solid var(--ui-border, #e5e7eb);
			border-radius: 8px;
			border-left: 4px solid var(--ui-accent, #e10600);
		}
		.news-detail-heading {
			margin: 0 0 6px;
			font-size: 17px;
			font-weight: 700;
			line-height: 1.45;
			color: var(--ui-text, #111827);
		}
		.news-article-title-card .auth-container {
			margin: 0 !important;
			padding: 0 !important;
			border-bottom: none !important;
			font-size: 13px;
			line-height: 1.4;
			color: var(--ui-subtext, #6b7280) !important;
		}

		/* 底部「本篇文章」：不用 class title，避免 theme.css 全局 .title 破坏对齐 */
		.news-detail-footer-bar {
			display: flex !important;
			align-items: center !important;
			justify-content: space-between !important;
			flex-wrap: wrap;
			gap: 12px;
			min-height: 52px;
			height: auto !important;
			padding: 10px 16px !important;
			box-sizing: border-box;
		}
		.news-footer-summary {
			flex: 1;
			min-width: 200px;
			margin: 0;
			padding: 0;
			line-height: 1.45;
			display: flex;
			align-items: center;
			text-align: left;
			font-size: 15px;
			font-weight: 500;
			color: var(--ui-subtext, #6b7280);
			background: transparent !important;
			border: none !important;
			box-shadow: none !important;
		}
		.news-detail-footer-bar .layui-btn {
			flex-shrink: 0;
			align-self: center;
		}
	</style>
	<body style="padding-bottom: 10px;">

		<div id="app">
			<div class="layui-carousel" id="swiper" :style='{"boxShadow":"0 0 6px #608090","margin":"0 auto","borderColor":"rgba(0,0,0,.3)","borderRadius":"0px","borderWidth":"0","width":"100%","borderStyle":"solid"}'>
			  <div carousel-item id="swiper-item">
				<div v-for="(item,index) in swiperList" :key="index">
					<div style="position: relative; width: 100%; height: 100%; overflow: hidden; background-color: #000;">
						<div :style="{'backgroundImage': 'url(' + item.img + ')', 'backgroundSize': 'cover', 'backgroundPosition': 'center', 'filter': 'blur(15px)', 'position': 'absolute', 'width': '110%', 'height': '110%', 'top': '-5%', 'left': '-5%', 'zIndex': '0', 'opacity': '0.7'}"></div>
						<img style="width: 100%; height: 100%; object-fit: contain; position: relative; zIndex: '1';" :src="item.img" />
					</div>
				</div>
			  </div>
			</div>
			<div class="index-title news-page-section-head" :style='{"padding":"32px 28px","boxShadow":"none","margin":"20px auto 12px","borderColor":"transparent","backgroundColor":"transparent","color":"inherit","borderRadius":"8px","borderWidth":"0","fontSize":"inherit","borderStyle":"solid","height":"auto"}'>
			  <span>NEWS / INFORMATION</span><span>篮球资讯</span>
			</div>

			<div class="news-container">
				<div class="news-article-title-card">
					<h1 class="news-detail-heading">{{detail.title}}</h1>
					<div class="auth-container">
						时间：{{detail.addtime}}
					</div>
				</div>
				<div class="content" style="word-break: break-all;" v-html="detail.content">
				</div>

				<!-- <div class="bottom-container">
					<div class="title">
						本篇文章：{{detail.title}}
					</div>
					<div onclick="back()" class="btn">
						返回列表
					</div>
				</div> -->
				<div class="btn-container news-detail-footer-bar" :style='{"padding":"10px 16px","boxShadow":"none","margin":"10px auto","borderColor":"transparent","backgroundColor":"transparent","borderRadius":"8px","alignItems":"center","borderWidth":"0","borderStyle":"solid","justifyContent":"space-between","height":"auto"}'>
					<div class="news-footer-summary">
						本篇文章：{{detail.title}}
					</div>
					<button :style='{"padding":"0 15px","boxShadow":"0 0 8px rgba(0,0,0,0)","margin":"0 0 0 10px","borderColor":"#409EFF","backgroundColor":"rgba(97, 132, 150, 1)","color":"#fff","borderRadius":"4px","borderWidth":"0","width":"auto","fontSize":"14px","borderStyle":"solid","height":"40px"}' onclick="back()" type="button" class="layui-btn layui-btn-lg btn-theme">
						<i v-if="true" class="layui-icon">&#xe65c;</i> 返回列表
					</button>
				</div>
			</div>
		</div>

		<!-- layui -->
		<script src="../../layui/layui.js"></script>
		<!-- vue -->
		<script src="../../js/vue.js"></script>
		<!-- 组件配置信息 -->
		<script src="../../js/config.js"></script>
		<!-- 扩展插件配置信息 -->
		<script src="../../modules/config.js"></script>
		<!-- 工具方法 -->
		<script src="../../js/utils.js"></script>

		<script>
			var vue = new Vue({
				el: '#app',
				data: {
					// 轮播图
					swiperList: [{
						img: '../../img/banner.jpg'
					}],
					detail: {}
				},
				methods: {
					jump(url) {
						jump(url)
					}
				}
			})

			layui.use(['layer', 'element', 'carousel', 'laypage', 'http', 'jquery'], function() {
				var layer = layui.layer;
				var element = layui.element;
				var carousel = layui.carousel;
				var laypage = layui.laypage;
				var http = layui.http;
				var jquery = layui.jquery;

				var id = http.getParam('id');

				// 获取轮播图 数据
				http.request('config/list', 'get', {
					page: 1,
					limit: 5
				}, function(res) {
					if (res.data.list.length > 0) {
						let swiperList = [];
						res.data.list.forEach(element => {
							if (element.value != null) {
								swiperList.push({ img: http.baseurl + element.value });
							}
						});
						vue.swiperList = swiperList;

						vue.$nextTick(() => {
							carousel.render({
								elem: '#swiper',
								width: '100%',
								height: '350px',
								arrow: 'hover',
								anim: 'default',
								autoplay: 'true',
								interval: '3000',
								indicator: 'outside'
							});
						})
					}
				});

				// 详情信息
				http.request('news/detail/' + id, 'get', {}, function(res) {
					vue.detail = res.data
					vue.detail.content = vue.detail.content.replace(/<img/g,'<img style="width: 100%;"')
				});

			});
		</script>
	</body>
</html>
